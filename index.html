<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>N4TN · Tidskub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 11 16 6l10 5v11l-10 5-10-5z' fill='none' stroke='%23a8dcff' stroke-width='2'/><path d='M6 11l10 5 10-5M16 16v11' fill='none' stroke='%23a8dcff' stroke-width='1.4' opacity='.6'/></svg>" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">N4TN</span>
          <span class="brand-sub">Tidskub</span>
        </div>
        <div class="topbar-actions">
          <span id="file-name" class="file-name">Ingen video laddad</span>
          <button id="random-btn" class="btn" type="button" title="Slumpa de reglage som får slumpas">🎲 Slumpa</button>
          <button id="reset-btn" class="btn" type="button" title="Återställ alla reglage till standard">Återställ</button>
          <button id="open-btn" class="btn btn-primary" type="button">Öppna video…</button>
          <input id="file-input" type="file" accept="video/*" hidden />
        </div>
      </header>

      <main class="layout">
        <section class="stage-wrap">
          <div id="stage" class="stage">
            <div id="frame" class="frame">
              <canvas id="canvas"></canvas>
              <div id="empty-hint" class="hint">
                Dra in en video hit eller klicka på <b>Öppna video…</b>
              </div>
              <div id="busy" class="busy" hidden>
                <div class="busy-label" id="busy-label">Bygger volym…</div>
                <div class="bar"><div id="busy-bar" class="bar-fill"></div></div>
                <button id="busy-cancel" class="btn btn-small" type="button" hidden>Avbryt</button>
              </div>
            </div>
            <div id="drop-overlay" class="drop-overlay" hidden>Släpp videon för att ladda den</div>
          </div>

          <div class="transport">
            <button id="play-btn" class="icon-btn" type="button" title="Spela/pausa (mellanslag)" disabled>
              <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
            </button>
            <span id="time-label" class="time">0:00.0 / 0:00.0</span>
            <input id="scrub" class="scrub" type="range" min="0" max="1000" step="1" value="0" disabled />
            <select id="speed" class="speed" title="Hastighet på klippet">
              <option value="0.1">0.1×</option>
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
              <option value="3">3×</option>
              <option value="4">4×</option>
            </select>
            <button id="mute-btn" class="icon-btn" type="button" title="Ljud av/på">
              <svg id="icon-sound" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
              <svg id="icon-muted" viewBox="0 0 24 24" width="18" height="18" hidden><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </section>

        <aside id="panel" class="panel"></aside>
      </main>
    </div>
  </body>
</html>
